<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WWDC Library</title>
  <meta name="description" content="WWDC 2024–2025 session archive with summaries and PDFs. Client-side search, no server required." />
  <!-- Open Graph -->
  <meta property="og:title" content="WWDC Libary" />
  <meta property="og:description" content="All WWDC sessions organized in one place. Rebuilding and restructuring every session starting with WWDC 2024." />
  <meta property="og:image" content="https://nilotic.github.io/WWDC/og-image.png" />
  <meta property="og:url" content="https://nilotic.github.io/WWDC/index.html" />
  <meta property="og:type" content="website" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WWDC Libary" />
  <meta name="twitter:description" content="All WWDC sessions organized in one place." />
  <meta name="twitter:image" content="https://nilotic.github.io/WWDC/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spectral:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260312-2" />
</head>
<body>
  <div class="bg"></div>
  <header class="hero">
    <div class="hero-inner">
      <div class="kicker">WWDC 2024–2025 ARCHIVE</div>
      <h1>WWDC Library</h1>
      <p class="sub">Browse all WWDC sessions in one place — organized and easy to explore.</p>
      <div class="controls">
        <div class="searchbox">
          <input id="query" type="search" placeholder="Search sessions by title, topic, or keyword…" autocomplete="off" />
          <button id="searchBtn">Search</button>
        </div>
        <div class="filters">
          <label class="year-filter" for="yearFilter">
            <span class="year-filter-label">WWDC</span>
            <select id="yearFilter" aria-label="Filter by WWDC year">
              <option value="" selected>All</option>
              <option value="2024">24</option>
              <option value="2025">25</option>
              <option value="2026">26</option>
            </select>
          </label>
        </div>
      </div>
      <div class="chips">
        <button class="chip" data-q="SwiftUI">SwiftUI</button>
        <button class="chip" data-q="visionOS">visionOS</button>
        <button class="chip" data-q="App Intents">App Intents</button>
        <button class="chip" data-q="Concurrency">Concurrency</button>
        <button class="chip" data-q="Core ML">Core ML</button>
      </div>
      <div class="meta">
        <span id="stats">Loading index…</span>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="results">
      <div class="results-header">
        <h2>Results</h2>
        <span id="count"></span>
      </div>
      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div>© WWDC Archive</div>
    <div class="links">
      <a href="https://github.com/nilotic/WWDC">GitHub</a>
      <a href="search.json">Search data</a>
    </div>
  </footer>

  <script src="https://unpkg.com/lunr/lunr.js"></script>
  <script src="search.js?v=20260323-4"></script>
</body>
</html>
