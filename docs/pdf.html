<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WWDC PDF Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pdf.css" />
</head>
<body>
  <header class="top">
    <a class="back" href="index.html">← Back</a>
  </header>
  <main class="wrap">
    <div id="title" class="title"></div>
    <div id="progress" class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div class="controls">
      <button id="download" class="download">Download</button>
    </div>
    <div id="status" class="status">Initializing…</div>
    <div class="viewer">
      <div id="pages" class="pages"></div>
    </div>
    <pre id="debug" class="debug"></pre>
  </main>

  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const debugEl = document.getElementById('debug');
      const setStatus = (msg) => { statusEl.textContent = msg; };
      const setDebug = (msg) => { debugEl.textContent = msg || ''; };

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error(`Failed to load ${src}`));
          document.head.appendChild(s);
        });
      }

      setStatus('Loading viewer…');
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')
        .then(() => loadScript(`pdf.js?v=${Date.now()}`))
        .catch((err) => {
          setStatus('Viewer failed to load.');
          setDebug(err.message || String(err));
        });
    })();
  </script>
</body>
</html>
